spring.application.name=vieweat

# 1. Database Connection Setup
spring.datasource.url=jdbc:mysql://localhost:3306/vieweat_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=blob33

# 2. Hibernate Settings (The Magic)
# "update" means: If I change my Java class, automatically update the MySQL table to match.
spring.jpa.hibernate.ddl-auto=update

# Optional: Show the SQL in the console so you can see what's happening
spring.jpa.show-sql=true
