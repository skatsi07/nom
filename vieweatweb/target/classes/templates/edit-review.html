<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">

    <header>
      <div class="nav-buttons">
        <a th:href="@{/manage-reviews}" class="btn-icon">Cancel</a>
      </div>
      <div class="logo">Edit Review</div>
      <div style="width: 40px;"></div>
    </header>

    <main class="main-content" style="padding: 20px;">
        
        <form th:action="@{/update}" th:object="${review}" method="post" enctype="multipart/form-data" 
              style="display: flex; flex-direction: column; gap: 20px;">
            
            <input type="hidden" th:field="*{id}">

            <div style="background: #fff; padding: 5px 0;">
                <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">The Basics</h3>
                
                <div class="form-group">
                    <label>Place Name *</label>
                    <input type="text" th:field="*{placeName}" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Date Visited *</label>
                    <input type="date" th:field="*{date}" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <div style="flex: 1;">
                        <label>Cuisine</label>
                        <input type="text" th:field="*{cuisine}" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div style="flex: 1;">
                        <label>Price ($)</label>
                        <input type="number" step="0.5" th:field="*{pricePerPerson}" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                </div>
            </div>

            <div>
                <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">The Ratings (0-10)</h3>
                
                <div class="form-group">
                    <label>Overall Rating *</label>
                    <input type="number" step="0.1" min="0" max="10" th:field="*{overallRating}" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px;">
                    <div><label style="font-size:0.8rem;">Food</label><input type="number" step="0.1" max="10" th:field="*{foodScore}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;"></div>
                    <div><label style="font-size:0.8rem;">Service</label><input type="number" step="0.1" max="10" th:field="*{serviceScore}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;"></div>
                    <div><label style="font-size:0.8rem;">Ambiance</label><input type="number" step="0.1" max="10" th:field="*{ambianceScore}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;"></div>
                </div>
            </div>

            <div>
                <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Details</h3>
                <div class="form-group">
                    <textarea th:field="*{overallDesc}" rows="5" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Inter';"></textarea>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <input type="text" th:field="*{instagramUrl}" placeholder="Instagram URL" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px;">
                    <input type="text" th:field="*{tiktokUrl}" placeholder="TikTok URL" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
            </div>

            <div>
                <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Specific Dishes</h3>
                
                <div id="existing-items-container" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;">
                    <div th:each="item, stat : *{foodItems}" class="food-item-row" style="background: #f0f0f0; padding: 15px; border-radius: 12px; border: 1px solid #ddd;">
                        
                        <input type="hidden" th:field="*{foodItems[__${stat.index}__].id}">
                        
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <input type="text" th:field="*{foodItems[__${stat.index}__].name}" style="flex: 2; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            <input type="number" step="0.1" th:field="*{foodItems[__${stat.index}__].rating}" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        </div>
                        <input type="text" th:field="*{foodItems[__${stat.index}__].description}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                </div>

                <div id="food-items-container" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;"></div>

                <button type="button" onclick="addFoodItem()" class="btn-outline" style="border-style: dashed; color: #555;">
                    <i class="fas fa-plus"></i> Add New Dish
                </button>
            </div>

            <div>
                 <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Photos</h3>
                 
                 <div style="display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto;">
                    <img th:each="photo : *{photos}" th:src="${photo.photoUrl}" style="height: 80px; width: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;">
                 </div>

                 <div class="form-group">
                    <label>Add More Photos</label>
                    <input type="file" name="reviewImages" multiple accept="image/png, image/jpeg"
                           style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff;">
                </div>
            </div>

            <button type="submit" class="btn-dark" style="width: 100%; padding: 15px; margin-top: 20px; font-size: 1rem;">
                Update Review
            </button>

        </form>

    </main>
</div>

<script>
    // We start the index count based on how many items already exist
    // This prevents new items from overwriting existing ones in the array
    let itemIndex = [[${review.foodItems.size()}]];

    function addFoodItem() {
        const container = document.getElementById('food-items-container');
        
        const rowHtml = `
            <div class="food-item-row" style="background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; position: relative;">
                <strong style="display: block; margin-bottom: 10px; color: #555;">New Dish</strong>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" name="foodItems[${itemIndex}].name" placeholder="Dish Name" required style="flex: 2; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <input type="number" step="0.1" min="0" max="10" name="foodItems[${itemIndex}].rating" placeholder="Score" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                </div>
                <input type="text" name="foodItems[${itemIndex}].description" placeholder="Description..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                <div style="position: absolute; top: 10px; right: 10px; cursor: pointer; color: #ccc;" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', rowHtml);
        itemIndex++;
    }
</script>

</body>
</html>
