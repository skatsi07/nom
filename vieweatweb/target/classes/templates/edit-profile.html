<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-wrapper">

    <header>
      <div class="nav-buttons">
         <a th:href="@{/}" class="btn-dark">Cancel</a>
      </div>
      <div class="logo">Edit Profile</div>
      <div style="width: 40px;"></div>
    </header>

    <main class="main-content" style="padding: 20px;">
        
        <form th:action="@{/edit-profile/save}" method="post" enctype="multipart/form-data" th:object="${user}"
              style="display: flex; flex-direction: column; gap: 20px;">
            
            <div class="form-group">
                <label style="font-weight: 600; margin-bottom: 5px; display: block;">Update Bio</label>
                <input type="text" th:field="*{bio}" style="padding: 12px; width: 100%; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="form-group">
                <label style="font-weight: 600; margin-bottom: 5px; display: block;">Profile Picture</label>
                <input type="file" name="image" accept="image/png, image/jpeg" 
                       style="padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; background: #fff;">
            </div>

            <button type="submit" class="btn-dark" style="padding: 15px; margin-top: 10px;">Save Changes</button>
        </form>

    </main>
</div>
</body>
</html>
