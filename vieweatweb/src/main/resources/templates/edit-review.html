<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Styles for the image preview grid */
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Style for the selected "Cover" image */
        .preview-item.selected {
            border-color: #000;
            /* Black border for selected */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .cover-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            text-align: center;
            padding: 4px;
            display: none;
        }

        .preview-item.selected .cover-badge {
            display: block;
        }
    </style>
</head>

<body>

    <div class="app-wrapper">

        <header>
            <div class="nav-buttons">
                <a th:href="@{/manage-reviews}" class="btn-icon">Cancel</a>
            </div>
            <div class="logo">Edit Review</div>
            <div style="width: 40px;"></div>
        </header>

        <main class="main-content" style="padding: 20px;">

            <form th:action="@{/update}" th:object="${review}" method="post" enctype="multipart/form-data"
                style="display: flex; flex-direction: column; gap: 20px;">

                <input type="hidden" th:field="*{id}">

                <input type="hidden" name="coverSelectionType" id="coverSelectionType" value="none">
                <input type="hidden" name="selectedExistingCoverId" id="selectedExistingCoverId">
                <input type="hidden" name="selectedNewCoverIndex" id="selectedNewCoverIndex">

                <input type="hidden" name="deletedPhotoIds" id="deletedPhotoIds" value="">

                <div style="background: #fff; padding: 5px 0;">
                    <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">The Basics</h3>
                    <div class="form-group">
                        <label>Place Name *</label>
                        <input type="text" th:field="*{placeName}" required
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>Date Visited *</label>
                        <input type="date" th:field="*{date}" required
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <div style="flex: 1;">
                            <label>Cuisine</label>
                            <input type="text" th:field="*{cuisine}"
                                style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>
                        <div style="flex: 1;">
                            <label>Price ($)</label>
                            <input type="number" step="0.5" th:field="*{pricePerPerson}"
                                style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>
                    </div>
                </div>

                <div>
                    <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">The Ratings (0-10)</h3>
                    <div class="form-group">
                        <label>Overall Rating *</label>
                        <input type="number" step="0.1" min="0" max="10" th:field="*{overallRating}" required
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <div><label style="font-size:0.8rem;">Food</label><input type="number" step="0.1" max="10"
                                th:field="*{foodScore}"
                                style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;"></div>
                        <div><label style="font-size:0.8rem;">Service</label><input type="number" step="0.1" max="10"
                                th:field="*{serviceScore}"
                                style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;"></div>
                        <div><label style="font-size:0.8rem;">Ambiance</label><input type="number" step="0.1" max="10"
                                th:field="*{ambianceScore}"
                                style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;"></div>
                    </div>
                </div>

                <div>
                    <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Details</h3>
                    <div class="form-group">
                        <textarea th:field="*{overallDesc}" rows="5"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Inter';"></textarea>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <input type="text" th:field="*{instagramUrl}" placeholder="Instagram URL"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px;">
                        <input type="text" th:field="*{tiktokUrl}" placeholder="TikTok URL"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                </div>

                <div>
                    <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Specific Dishes</h3>
                    <div id="existing-items-container"
                        style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;">
                        <div th:each="item, stat : *{foodItems}" class="food-item-row"
                            style="background: #f0f0f0; padding: 15px; border-radius: 12px; border: 1px solid #ddd;">
                            <input type="hidden" th:field="*{foodItems[__${stat.index}__].id}">
                            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                                <input type="text" th:field="*{foodItems[__${stat.index}__].name}"
                                    style="flex: 2; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                                <input type="number" step="0.1" th:field="*{foodItems[__${stat.index}__].rating}"
                                    style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            </div>
                            <input type="text" th:field="*{foodItems[__${stat.index}__].description}"
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        </div>
                    </div>
                    <div id="food-items-container"
                        style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;"></div>
                    <button type="button" onclick="addFoodItem()" class="btn-outline"
                        style="border-style: dashed; color: #555;">
                        <i class="fas fa-plus"></i> Add New Dish
                    </button>
                </div>

                <div>
                    <h3 style="font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Photos</h3>

                    <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">Existing Photos (Click to set Cover)</p>

                    <div class="image-preview-grid" id="existingPhotosGrid">
                        <div th:each="photo, stat : *{photos}" class="preview-item existing-photo"
                            th:classappend="${stat.index == 0} ? 'selected'" th:data-id="${photo.id}"
                            onclick="selectExisting(this)">
                            
                            <img th:src="${photo.photoUrl}">
                            <div class="cover-badge">COVER</div>

                            <div class="delete-badge" 
                                 th:onclick="'deleteExistingPhoto(event, this, ' + ${photo.id} + ')'">
                                <i class="fas fa-times"></i>
                            </div>

                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 20px;">
                        <label>Add More Photos</label>
                        <input type="file" id="imageInput" name="reviewImages" multiple accept="image/png, image/jpeg"
                            onchange="handleFileSelect(event)"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff;">

                        <div id="newImagePreviewContainer" class="image-preview-grid"></div>
                    </div>
                </div>

                <button type="submit" class="btn-dark"
                    style="width: 100%; padding: 15px; margin-top: 20px; font-size: 1rem;">
                    Update Review
                </button>

            </form>

        </main>
    </div>

    <script>
        // --- DISH LOGIC ---
        let itemIndex = [[${ review.foodItems.size() }]];

        function addFoodItem() {
            const container = document.getElementById('food-items-container');
            const rowHtml = `
            <div class="food-item-row" style="background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; position: relative;">
                <strong style="display: block; margin-bottom: 10px; color: #555;">New Dish</strong>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" name="foodItems[${itemIndex}].name" placeholder="Dish Name" required style="flex: 2; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <input type="number" step="0.1" min="0" max="10" name="foodItems[${itemIndex}].rating" placeholder="Score" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                </div>
                <input type="text" name="foodItems[${itemIndex}].description" placeholder="Description..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                <div style="position: absolute; top: 10px; right: 10px; cursor: pointer; color: #ccc;" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>
            </div>
        `;
            container.insertAdjacentHTML('beforeend', rowHtml);
            itemIndex++;
        }

        // --- PHOTO LOGIC ---

        const typeInput = document.getElementById('coverSelectionType');
        const existingIdInput = document.getElementById('selectedExistingCoverId');
        const newIndexInput = document.getElementById('selectedNewCoverIndex');
        
        // Input for deleted photo IDs
        const deletedPhotosInput = document.getElementById('deletedPhotoIds');
        let deletedIds = [];

        // 1. DELETE PHOTO
        function deleteExistingPhoto(event, element, id) {
            // Prevent selecting the image as cover when clicking the X
            event.stopPropagation();
            
            // Add ID to array
            deletedIds.push(id);
            deletedPhotosInput.value = deletedIds.join(",");

            // Hide the image visually
            const parent = element.closest('.preview-item');
            parent.style.display = 'none';
            parent.classList.remove('selected'); // Unselect if it was selected
        }

        // 2. SELECT COVER (Existing)
        function selectExisting(element) {
            clearAllSelections();
            element.classList.add('selected');
            typeInput.value = 'existing';
            existingIdInput.value = element.getAttribute('data-id');
        }

        // 3. HANDLE NEW UPLOADS & SELECT COVER (New)
        function handleFileSelect(event) {
            const files = event.target.files;
            const container = document.getElementById('newImagePreviewContainer');
            container.innerHTML = ''; 

            if (files.length === 0) return;

            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const div = document.createElement('div');
                    div.className = 'preview-item new-photo'; 

                    div.onclick = function () {
                        clearAllSelections();
                        div.classList.add('selected');
                        typeInput.value = 'new';
                        newIndexInput.value = index;
                    };

                    div.innerHTML = `<img src="${e.target.result}"><div class="cover-badge">COVER</div>`;
                    container.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
        }

        function clearAllSelections() {
            document.querySelectorAll('.preview-item').forEach(el => el.classList.remove('selected'));
            typeInput.value = 'none';
            existingIdInput.value = '';
            newIndexInput.value = '';
        }
    </script>

</body>

</html>
