<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Reviews</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="app-wrapper">

    <header>
      <div class="nav-buttons">
        <a th:href="@{/}" class="btn-icon"><i class="fas fa-arrow-left"></i></a>
      </div>
      <div class="logo">My Reviews</div>
      <div style="width: 40px;"></div>
    </header>

    <main class="main-content" style="padding: 20px;">
        
        <div style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 10px;">Select a review to edit</h2>
        </div>

        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div th:each="review : ${reviews}" 
                 style="background: white; padding: 15px; border-radius: 12px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                
                <div style="flex: 1;">
                    <strong th:text="${review.placeName}" style="font-size: 1.1rem; display: block;">Place Name</strong>
                    <span th:text="${review.date}" style="color: #888; font-size: 0.9rem;">Date</span>
                    <div style="color: #e5c100; font-size: 0.9rem; margin-top: 5px;">
                        <span th:text="${review.overallRating}">5.0</span> ★
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <a th:href="@{/edit/{id}(id=${review.id})}" class="btn-dark" style="padding: 8px 15px; text-decoration: none; font-size: 0.9rem;">
                        Edit <i class="fas fa-pen" style="margin-left: 5px;"></i>
                    </a>

                    <a th:href="@{/delete/{id}(id=${review.id})}" 
                       onclick="return confirm('Are you sure you want to delete this review? This cannot be undone.');"
                       class="btn-red">
                        Delete <i class="fas fa-trash" style="margin-left: 5px;"></i>
                    </a>
                </div>

            </div>
        </div>

    </main>
</div>
</body>
</html>
