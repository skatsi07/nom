<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Let's Eat...</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
  <div class="logo">Let's Eat...</div>
  <div class="nav-buttons">
    <button class="btn-dark">Past Reviews</button>
  </div>
</header>

<section class="hero">
  <div class="profile-pic">
    <span>Photo of Me</span>
  </div>
  <div class="social-buttons">
    <button class="btn-black">Instagram</button>
    <button class="btn-black">TikTok</button>
  </div>
</section>

<section class="container">
  <h2>Most Recent Eats</h2>
  <div class="review-list">
    <div class="review-row" th:each="review : ${reviews}">
      <span class="place-name" th:text="${review.placeName}">Place Name</span>
      <span class="stars">
                    <span th:each="i : ${#numbers.sequence(1, review.overallRating)}" style="color: #e5c100;">*</span>
                </span>
      <span class="date" th:text="${review.date}">12/12/2025</span>
    </div>
  </div>
</section>

<section class="container">
  <h2>Explore Reviews by Category</h2>
  <div class="category-grid">
    <div class="cat-box"></div> <div class="cat-box"></div> <div class="cat-box"></div>
    <div class="cat-box"></div> <div class="cat-box"></div>
    <div class="cat-box"></div> <div class="cat-box"></div> <div class="cat-box"></div>
    <div class="cat-box"></div> <div class="cat-box"></div>
  </div>
</section>

<section class="container">
  <h2>Food Map</h2>
  <div class="map-placeholder">
    <p>Interactive Map</p>
  </div>
</section>

<section class="container">
  <h2>Quick Links</h2>
  <div class="quick-links-grid">
    <div class="link-card">
      <h3>CHICKEN</h3>
      <div class="card-content">
        <div class="avatar small"></div>
        <div>
          <strong>Instagram</strong><br><small>Reel</small>
        </div>
      </div>
    </div>
    <div class="link-card">
      <h3>MANGIAIIIIII</h3>
      <div class="card-content">
        <div class="avatar small"></div>
        <div>
          <strong>Instagram</strong><br><small>Reel</small>
        </div>
      </div>
    </div>
    <div class="link-card">
      <h3>EATING</h3>
      <div class="card-content">
        <div class="avatar small"></div>
        <div>
          <strong>TikTok</strong><br><small>Video</small>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-left">
    <h3>Contact Me...</h3>
    <div class="social-icons">
      <i class="fab fa-facebook"></i>
      <i class="fab fa-linkedin"></i>
      <i class="fab fa-youtube"></i>
      <i class="fab fa-instagram"></i>
    </div>
  </div>
  <div class="footer-links">
    <div class="col"><strong>Topic</strong><br>Page<br>Page<br>Page</div>
    <div class="col"><strong>Topic</strong><br>Page<br>Page<br>Page</div>
    <div class="col"><strong>Topic</strong><br>Page<br>Page<br>Page</div>
  </div>
</footer>

</body>
</html>
