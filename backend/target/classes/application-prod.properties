# Production Configuration (Active when spring.profiles.active=prod)

# 1. Database - FAIL FAST if variables are missing
# We remove the default values here. If the environment variables are not set,
# the application will fail to start with a clear "Value for placeholder ... not found" error.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 2. Hibernate - Optimized for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
