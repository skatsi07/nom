spring.application.name=vieweat

# 1. Database Connection Setup (Supabase Production)
# Use the SPRING_DATASOURCE_URL environment variable if available (Standard on Railway/Render)
# Otherwise fall back to these defaults for local dev (if you have them set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.voqprdlmfgdldefqvjzs.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# 2. Hibernate Settings (The Magic)
# "update" means: If I change my Java class, automatically update the MySQL table to match.
spring.jpa.hibernate.ddl-auto=update

# Explicitly set the Dialect (improves stability on some platforms)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional: Show the SQL in the console so you can see what's happening
spring.jpa.show-sql=true

# --- FILE UPLOAD LIMITS ---
server.tomcat.max-part-count=200
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB

# 3. Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.jwt-secret=${SUPABASE_JWT_SECRET}
